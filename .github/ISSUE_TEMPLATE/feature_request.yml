name: Suggest an idea
description: Something you'd like NoemaBoard to do.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe what you're trying to do and how it would help.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Any workaround, or how another tool handles it.
