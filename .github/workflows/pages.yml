# Publishes a copy of the front page to GitHub Pages (a well-known address that link previews on
# LinkedIn and others load reliably). The app itself stays on the main host (repository variable
# APP_URL, default https://app.noemaboard.workers.dev/app/).
name: Deploy front page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Off unless the repository variable PAGES_ENABLED is 'true' (this project is hosted on Cloudflare).
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build front page
        run: node scripts/build-pages-site.mjs
        env:
          # base_url is right for project pages, user pages and custom domains alike.
          SITE_URL: ${{ format('{0}/', steps.pages.outputs.base_url) }}
          APP_URL: ${{ vars.APP_URL || 'https://app.noemaboard.workers.dev/app/' }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
