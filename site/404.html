<!doctype html>
<!-- Served by Cloudflare for any address that does not exist, at any depth: keep every path absolute. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found · NoemaBoard</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17191c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .lost { min-height: calc(100vh - var(--header-h)); min-height: calc(100svh - var(--header-h)); display: grid; place-items: center; padding: 48px 0 80px; text-align: center; }
    .lost h1 { font-size: clamp(2.2rem, 1.6rem + 2.6vw, 3.4rem); line-height: 1.06; }
    .lost__card { display: inline-block; margin-bottom: 28px; padding: 14px 18px 16px; border-radius: 3px; background: var(--c-yellow-tint); box-shadow: inset 0 3px 0 var(--c-yellow), var(--shadow-card); color: var(--text-2); font-size: 0.9375rem; }
    .site-header .btn { margin-left: auto; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" href="/" aria-label="NoemaBoard home">
        <picture>
          <source srcset="/assets/logo-light.svg" media="(prefers-color-scheme: dark)">
          <img src="/assets/logo.svg" alt="NoemaBoard" width="190" height="20">
        </picture>
      </a>
      <a class="btn btn--small btn--primary" href="/app/">Open app</a>
    </div>
  </header>
  <main class="lost dotted">
    <div class="wrap">
      <p class="lost__card">This card has moved, or it was never here.</p>
      <h1>Nothing on this part of the board</h1>
      <p class="section__lede">The address may be mistyped, or the page has moved.</p>
      <div class="actions actions--center">
        <a class="btn btn--primary btn--large" href="/app/">Open NoemaBoard</a>
        <a class="btn btn--ghost btn--large" href="/">Front page</a>
      </div>
    </div>
  </main>
</body>
</html>
