<!doctype html>
<!--
  Source of og.png, the 1200 x 630 link-preview image for LinkedIn, X and others.
  Render: npx electron design/site-previews/render.cjs --only og   (from the repository root)
  Not deployed: scripts/build-site.mjs leaves this file out.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>NoemaBoard link preview</title>
<style>
  @font-face { font-family: 'Inter'; src: url('assets/fonts/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Fraunces'; src: url('assets/fonts/fraunces-latin-opsz-normal.woff2') format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background-color: #eceef1;
    background-image: radial-gradient(circle, rgba(31, 35, 40, 0.17) 1.4px, transparent 1.9px);
    background-size: 30px 30px; background-position: 15px 15px;
    color: #1f2328; font-family: Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .copy { position: absolute; left: 76px; top: 104px; width: 610px; }
  .logo { display: block; height: 48px; width: auto; }
  h1 {
    margin: 52px 0 0; font-family: Fraunces, Georgia, serif; font-optical-sizing: auto;
    font-weight: 570; font-size: 84px; line-height: 0.98; letter-spacing: -0.026em;
  }
  .hl { background: linear-gradient(transparent 60%, rgba(242, 194, 59, 0.6) 60%, rgba(242, 194, 59, 0.6) 90%, transparent 90%); padding: 0 4px; margin: 0 -4px; }
  .sub { margin: 30px 0 0; font-size: 30px; line-height: 1.32; font-weight: 450; color: #3d4350; letter-spacing: -0.005em; }
  .sub b { font-weight: 650; color: #1f2328; }
  .art { position: absolute; left: 0; top: 0; width: 1200px; height: 630px; }
</style>
</head>
<body>
  <svg class="art" viewBox="0 -36 1200 630" aria-hidden="true">
    <defs>
      <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#101828" flood-opacity="0.12"/></filter>
      <filter id="lift" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#101828" flood-opacity="0.2"/></filter>
      <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#8b93a1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>

    <!-- arrow from the note to the yellow card -->
    <path d="M1004 150 C 1040 150, 1048 196, 1074 206" fill="none" stroke="#8b93a1" stroke-width="3" stroke-linecap="round" marker-end="url(#head)"/>

    <!-- note -->
    <g filter="url(#sh)">
      <rect x="742" y="70" width="262" height="168" rx="5" fill="#ffffff"/>
    </g>
    <text x="770" y="124" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="600" fill="#1f2328">Big idea</text>
    <rect x="770" y="148" width="204" height="12" rx="6" fill="#e2e5ea"/>
    <rect x="770" y="172" width="180" height="12" rx="6" fill="#e2e5ea"/>
    <rect x="770" y="196" width="116" height="12" rx="6" fill="#e2e5ea"/>

    <!-- to-do -->
    <g filter="url(#sh)">
      <rect x="742" y="266" width="262" height="226" rx="5" fill="#ffffff"/>
    </g>
    <text x="770" y="312" font-family="Inter, sans-serif" font-size="26" font-weight="650" fill="#1f2328">This week</text>
    <rect x="770" y="330" width="206" height="8" rx="4" fill="#e2e5ea"/>
    <rect x="770" y="330" width="137" height="8" rx="4" fill="#30a46c"/>
    <rect x="770" y="362" width="28" height="28" rx="6" fill="#30a46c"/>
    <path d="M777 376l5 5 9-9" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="814" y="370" width="150" height="12" rx="6" fill="#e2e5ea"/>
    <rect x="770" y="406" width="28" height="28" rx="6" fill="#30a46c"/>
    <path d="M777 420l5 5 9-9" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="814" y="414" width="120" height="12" rx="6" fill="#e2e5ea"/>
    <rect x="771.5" y="451.5" width="25" height="25" rx="6" fill="#ffffff" stroke="#cfd4db" stroke-width="2.5"/>
    <rect x="814" y="458" width="136" height="12" rx="6" fill="#cfd4db"/>

    <!-- picture card -->
    <g filter="url(#sh)">
      <rect x="1032" y="300" width="230" height="200" rx="5" fill="#ffffff"/>
    </g>
    <clipPath id="pic"><rect x="1046" y="314" width="202" height="172" rx="3"/></clipPath>
    <g clip-path="url(#pic)">
      <rect x="1046" y="314" width="202" height="172" fill="#dce8f3"/>
      <circle cx="1196" cy="362" r="24" fill="#f2c23b"/>
      <path d="M1046 440c40-34 74-44 112-28s70 6 110-22v96H1046z" fill="#a9c5b6"/>
      <path d="M1046 458c56-16 98-10 136 2s60 2 86-8v34H1046z" fill="#3f7f7a"/>
    </g>

    <!-- the yellow card, being moved by Theo -->
    <g filter="url(#lift)">
      <rect x="1080" y="150" width="200" height="118" rx="5" fill="#fff7d6"/>
    </g>
    <rect x="1080" y="150" width="200" height="6" rx="3" fill="#f2c23b"/>
    <rect x="1104" y="186" width="140" height="13" rx="6.5" fill="#e6d49a"/>
    <rect x="1104" y="212" width="104" height="13" rx="6.5" fill="#e6d49a"/>
    <rect x="1073.5" y="143.5" width="213" height="131" rx="9" fill="none" stroke="#6e56cf" stroke-width="3"/>

    <!-- cursors -->
    <g transform="translate(1046 236)">
      <path d="M3 3 L31 15 L17 19 L13 33 Z" fill="#6e56cf" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>
      <rect x="28" y="30" width="84" height="38" rx="19" fill="#6e56cf"/>
      <text x="70" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="21" font-weight="650" fill="#fff">Theo</text>
    </g>
    <g transform="translate(948 444)">
      <path d="M3 3 L31 15 L17 19 L13 33 Z" fill="#f76b15" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>
      <rect x="28" y="30" width="88" height="38" rx="19" fill="#f76b15"/>
      <text x="72" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="21" font-weight="650" fill="#fff">Maya</text>
    </g>
  </svg>

  <div class="copy">
    <img class="logo" src="assets/logo.svg" alt="NoemaBoard">
    <h1>Lay out your ideas, <span class="hl">together</span>.</h1>
    <p class="sub">Free visual boards you edit live with your team. <b>No accounts. No limits.</b></p>
  </div>
</body>
</html>
